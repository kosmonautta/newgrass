<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="500" cy="500" r="450" fill="none" stroke="white" stroke-width="80"/>
  
  <!-- Meridian lines (vertical) -->
  <line x1="500" y1="50" x2="500" y2="950" stroke="white" stroke-width="50"/>
  <path d="M 320 100 Q 300 500 320 900" fill="none" stroke="white" stroke-width="50"/>
  <path d="M 680 100 Q 700 500 680 900" fill="none" stroke="white" stroke-width="50"/>
  
  <!-- Latitude lines (horizontal) -->
  <line x1="50" y1="500" x2="950" y2="500" stroke="white" stroke-width="50"/>
  <ellipse cx="500" cy="300" rx="380" ry="120" fill="none" stroke="white" stroke-width="50"/>
  <ellipse cx="500" cy="700" rx="380" ry="120" fill="none" stroke="white" stroke-width="50"/>
</svg>